<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>alphad — flow canvas</title>
<style>
  html, body { margin:0; height:100%; background:#04060b; overflow:hidden; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:absolute; font-family:"JetBrains Mono","Cascadia Mono",ui-monospace,monospace; pointer-events:none; }
  #hdr { top:20px; left:26px; }
  #sym { font-size:21px; font-weight:700; color:#edf1f8; letter-spacing:.04em; }
  #px  { font-size:21px; font-weight:600; color:#e8a33d; margin-left:14px; }
  #chg { font-size:15px; margin-left:10px; }
  #sub { margin-top:5px; font-size:11.5px; color:#556070; letter-spacing:.06em; }
  #feed { top:22px; right:118px; max-width:520px; text-align:right; font-size:11.5px; color:#556070; letter-spacing:.08em; }
  #feed .spec { color:#7d8798; border:1px solid #2a3040; border-radius:3px; padding:2px 7px; margin-left:8px; }
  #mark { bottom:130px; right:104px; font-size:11px; color:#3d4452; letter-spacing:.14em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud" id="hdr">
    <span id="sym">—</span><span id="px">—</span><span id="chg"></span>
    <div id="sub">order flow · the book through time</div>
  </div>
  <div class="hud" id="feed"></div>
  <div class="hud" id="mark">A L P H A R C H</div>
</div>
<script>
"use strict";
// ── The Pit ──────────────────────────────────────────────────────────────
const C = {
  bg0:"#04060b", bg1:"#0a0d14",
  amber:[232,163,61], amberHex:"#e8a33d", hot:"#fff3dc",
  up:"#46b37b", down:"#dc5057",
  text:"#c6cfdf", dim:"#7d8798", faint:"#556070", grid:"#141927",
  head:"#edf1f8",
};
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let S = null;                 // engine state
let demo = false;

function fit() {
  const d = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  if (S) draw();
}
window.addEventListener("resize", fit);

// ── data ────────────────────────────────────────────────────────────────
function connect() {
  try {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = e => { S = JSON.parse(e.data); demo = false; draw(); };
    ws.onerror = () => fallback();
    ws.onclose = () => setTimeout(connect, 3000);
  } catch (e) { fallback(); }
}
let fell = false;
function fallback() {
  if (fell) return; fell = true;
  fetch("demo-state.json").then(r => r.json()).then(j => { S = j; demo = true; draw(); })
    .catch(() => {});
}
connect(); setTimeout(() => { if (!S) fallback(); }, 1200);

// ── helpers ─────────────────────────────────────────────────────────────
const fmt = p => p >= 10000 ? p.toLocaleString("en-US", {maximumFractionDigits:0})
                            : p.toLocaleString("en-US", {maximumFractionDigits:2});
function niceStep(range, maxTicks) {
  const raw = range / maxTicks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw / mag <= m) return m * mag;
  return 10 * mag;
}

// ── render ──────────────────────────────────────────────────────────────
function draw() {
  if (!S || !S.heat || !S.heat.length) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const AX = 86;                       // right price axis
  const CVDH = 104;                    // bottom strip
  const plot = { x:0, y:0, w: W - AX, h: H - CVDH };

  // domains
  const t0 = S.buckets.length ? S.buckets[0].t : S.heat[0].t;
  const t1 = S.heat[S.heat.length-1].t;
  const tPad = (t1 - t0) * 0.015;
  const tEnd = t1 + tPad;
  const seamT = t0 + (tEnd - t0) * 0.40;
  const pPad = (S.high - S.low) * 0.13;
  const pLo = S.low - pPad, pHi = S.high + pPad;
  const X = t => plot.x + (t - t0) / (tEnd - t0) * plot.w;
  const Y = p => plot.y + (pHi - p) / (pHi - pLo) * plot.h;

  // ground
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // horizontal grid at nice price steps
  const step = niceStep(pHi - pLo, 9);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.font = "11px ui-monospace,monospace";
  for (let p = Math.ceil(pLo/step)*step; p < pHi; p += step) {
    const y = Math.round(Y(p)) + .5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plot.w, y); ctx.stroke();
    ctx.fillStyle = C.faint; ctx.textAlign = "left";
    ctx.fillText(fmt(p), plot.w + 12, y + 4);
  }

  // ── the fog: book liquidity through time (right world) ────────────────
  const cols = S.heat.filter(h => h.t >= seamT);
  if (cols.length > 1) {
    const tick = S.tick;
    const rows = Math.ceil((pHi - pLo) / tick);
    const gw = cols.length, gh = rows;
    const off = document.createElement("canvas");
    off.width = gw; off.height = gh;
    const octx = off.getContext("2d");
    const img = octx.createImageData(gw, gh);
    // reference level: 90th percentile
    const all = [];
    for (const c of cols) for (const k in c.cols) { const q = c.cols[k]; if (q > 0) all.push(q); }
    all.sort((a,b) => a-b);
    const qref = all.length ? all[Math.floor(all.length * 0.90)] : 1;
    const walls = [];
    const [ar, ag, ab] = C.amber;
    for (let i = 0; i < gw; i++) {
      const c = cols[i];
      for (const k in c.cols) {
        const p = +k, q = c.cols[k];
        const r = Math.floor((pHi - p) / tick);
        if (r < 0 || r >= gh) continue;
        const idx = (r * gw + i) * 4;
        const hotcell = q >= 4.2 * qref;
        const inten = Math.min(1, Math.pow(q / qref, 0.8));
        if (hotcell) {
          const fadeH = Math.min(1, i / 6);
          img.data[idx] = 255; img.data[idx+1] = 240; img.data[idx+2] = 214; img.data[idx+3] = Math.floor(235 * fadeH);
          walls.push([i, r]);
        } else {
          img.data[idx] = ar; img.data[idx+1] = ag; img.data[idx+2] = ab;
          const fade = Math.min(1, i / 6);
          img.data[idx+3] = Math.floor((16 + 150 * inten) * fade);
        }
      }
    }
    octx.putImageData(img, 0, 0);
    const fx = X(cols[0].t), fw = X(tEnd) - fx;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(off, fx, Y(pHi), fw, Y(pLo) - Y(pHi));
    // wall glow pass
    ctx.save();
    ctx.shadowColor = "rgba(232,163,61,.9)"; ctx.shadowBlur = 9;
    ctx.fillStyle = "rgba(255,243,220,.9)";
    const cw = fw / gw, ch = (Y(pLo) - Y(pHi)) / gh;
    for (const [i, r] of walls)
      ctx.fillRect(fx + i * cw, Y(pHi) + r * ch, Math.max(cw, 1.5), Math.max(ch * .8, 1.5));
    ctx.restore();

    // ── price path through the fog ──
    ctx.save();
    ctx.strokeStyle = C.head; ctx.lineWidth = 1.7;
    ctx.shadowColor = "rgba(237,241,248,.55)"; ctx.shadowBlur = 6;
    ctx.beginPath();
    cols.forEach((c, i) => { const x = X(c.t), y = Y(c.mid);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    ctx.restore();

    // ── bubbles: big prints riding the path ──
    for (const b of S.bigs.filter(b => b.t >= seamT)) {
      const r = Math.min(15, 4.5 + Math.sqrt(b.s) * 2.6);
      const col = b.a === "buy" ? C.up : C.down;
      ctx.save();
      ctx.globalAlpha = .92; ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(X(b.t), Y(b.p), r, 0, 7); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "rgba(4,6,11,.65)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X(b.t), Y(b.p), r, 0, 7); ctx.stroke();
    }
  }

  // ── the candle world (left of the seam) ───────────────────────────────
  const bks = S.buckets.filter(b => b.t + 60 <= seamT && b.h >= b.l);
  if (bks.length) {
    const bw = Math.max(3, (X(bks[0].t + 60) - X(bks[0].t)) * 0.62);
    for (const b of bks) {
      const xm = X(b.t + 30);
      const up = b.c >= b.o;
      const col = up ? C.up : C.down;
      ctx.strokeStyle = col; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(xm, Y(b.h)); ctx.lineTo(xm, Y(b.l)); ctx.stroke();
      const yO = Y(b.o), yC = Y(b.c);
      const top = Math.min(yO, yC), hgt = Math.max(Math.abs(yC - yO), 1.6);
      ctx.fillStyle = col;
      if (up) { ctx.globalAlpha = .28; ctx.fillRect(xm - bw/2, top, bw, hgt);
                ctx.globalAlpha = 1; ctx.strokeRect(xm - bw/2, top, bw, hgt); }
      else    { ctx.fillRect(xm - bw/2, top, bw, hgt); }
    }
  }

  // ── the seam: where the two worlds meet ───────────────────────────────
  const sx = Math.round(X(seamT)) + .5;
  const sg = ctx.createLinearGradient(0, 0, 0, plot.h);
  sg.addColorStop(0, "rgba(232,163,61,.05)");
  sg.addColorStop(.5, "rgba(232,163,61,.75)");
  sg.addColorStop(1, "rgba(232,163,61,.05)");
  ctx.strokeStyle = sg; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, plot.h); ctx.stroke();

  // session high / low
  ctx.setLineDash([5, 6]); ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(125,135,152,.35)";
  for (const [p, lab] of [[S.high, "HI"], [S.low, "LO"]]) {
    const y = Math.round(Y(p)) + .5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plot.w, y); ctx.stroke();
    ctx.fillStyle = C.dim; ctx.font = "10px ui-monospace,monospace";
    ctx.fillText(`${lab} ${fmt(p)}`, 10, y - 5);
  }
  ctx.setLineDash([]);

  // last-price tag on the axis
  const ly = Y(S.last);
  ctx.fillStyle = C.amberHex;
  const tag = fmt(S.last);
  ctx.font = "600 12px ui-monospace,monospace";
  const tw = ctx.measureText(tag).width + 16;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(plot.w + 6, ly - 11, tw, 22, 4); else ctx.rect(plot.w + 6, ly - 11, tw, 22);
  ctx.fill();
  ctx.fillStyle = "#0a0d14"; ctx.fillText(tag, plot.w + 14, ly + 4);
  ctx.strokeStyle = "rgba(232,163,61,.5)";
  ctx.beginPath(); ctx.moveTo(0, Math.round(ly)+.5); ctx.lineTo(plot.w, Math.round(ly)+.5);
  ctx.setLineDash([2, 5]); ctx.stroke(); ctx.setLineDash([]);

  // ── CVD strip ─────────────────────────────────────────────────────────
  const cy0 = H - CVDH;
  ctx.fillStyle = "rgba(10,13,20,.85)";
  ctx.fillRect(0, cy0, W, CVDH);
  ctx.strokeStyle = C.grid;
  ctx.beginPath(); ctx.moveTo(0, cy0 + .5); ctx.lineTo(W, cy0 + .5); ctx.stroke();
  const cs = S.cvds;
  if (cs && cs.length > 2) {
    let mn = Infinity, mx = -Infinity;
    for (const c of cs) { mn = Math.min(mn, c.v); mx = Math.max(mx, c.v); }
    const pad2 = (mx - mn) * .15 + 1e-9;
    const Yc = v => cy0 + 14 + (mx + pad2 - v) / (mx - mn + 2*pad2) * (CVDH - 28);
    const Xc = t => (t - cs[0].t) / (cs[cs.length-1].t - cs[0].t + 1e-9) * plot.w;
    // zero line
    if (mn < 0 && mx > 0) {
      ctx.strokeStyle = "rgba(85,96,112,.5)"; ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.moveTo(0, Math.round(Yc(0))+.5); ctx.lineTo(plot.w, Math.round(Yc(0))+.5);
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = C.amberHex; ctx.lineWidth = 1.5;
    ctx.beginPath();
    cs.forEach((c, i) => { i ? ctx.lineTo(Xc(c.t), Yc(c.v)) : ctx.moveTo(Xc(c.t), Yc(c.v)); });
    ctx.stroke();
    const lastv = cs[cs.length-1].v;
    ctx.fillStyle = C.dim; ctx.font = "11px ui-monospace,monospace";
    ctx.fillText(`CVD ${lastv >= 0 ? "+" : ""}${lastv.toFixed(1)}`, 12, cy0 + 22);
    if (S.funding) {
      const left = Math.max(0, S.funding.next - Date.now()/1000);
      const hh = String(Math.floor(left/3600)).padStart(2,"0");
      const mm = String(Math.floor(left%3600/60)).padStart(2,"0");
      ctx.fillText(`funding ${(S.funding.rate*100).toFixed(4)}% in ${hh}:${mm}` + (S.oi ? `   OI ${(S.oi/1000).toFixed(1)}K` : ""), 12, cy0 + 40);
    }
  }

  // hud text
  document.getElementById("sym").textContent = S.symbol;
  document.getElementById("px").textContent = fmt(S.last);
  const chg = S.open ? (S.last - S.open) / S.open * 100 : 0;
  const ce = document.getElementById("chg");
  ce.textContent = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`;
  ce.style.color = chg >= 0 ? C.up : C.down;
  document.getElementById("feed").innerHTML =
    `${S.feed} · alphad canvas` + (demo ? `<span class="spec">SPECIMEN DATA</span>` : "");
}
fit();
</script>
</body>
</html>
